[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs71d"
version = "0.1.0"
description = "Local control daemon for the CS7.1 Raspberry Pi appliance"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "CS7.1 maintainers"}]
dependencies = ["cs71-protocol==0.1.0"]

[project.scripts]
cs71d = "cs71d.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "../../host/src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cs71d = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "../../host/src"
exclude = "^(build|dist)/"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
