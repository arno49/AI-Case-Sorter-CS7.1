# Drop-in for the distribution's own caddy.service, installed to
# /etc/systemd/system/caddy.service.d/cs71.conf.
#
# Caddy is a system package with its own unit and its own hardening; this
# repository does not ship a replacement caddy.service, only the ordering
# that makes it start after the service it fronts, and the site config in
# ../caddy/Caddyfile.cs71 that is the actual point of this appliance's Caddy
# use: proxy only to loopback SvelteKit, expose nothing else.
[Unit]
After=cs71-web.service
Wants=cs71-web.service
