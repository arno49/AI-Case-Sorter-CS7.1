name: CI

on:
  push:
    paths:
      - "ArduinoCode/**"
      - "appliance/**"
      - "test/**"
      - "host/**"
      - "platformio.ini"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "ArduinoCode/**"
      - "appliance/**"
      - "test/**"
      - "host/**"
      - "platformio.ini"
      - ".github/workflows/firmware.yml"

jobs:
  appliance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenAPI validator
        run: python -m pip install --disable-pip-version-check -r appliance/contracts/requirements.txt
      - name: Validate OpenAPI document
        run: openapi-spec-validator appliance/contracts/cs71d-v1.openapi.json
      - name: Run cs71d v1 contract tests
        run: python -m unittest discover -s appliance/contracts/tests -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio==6.1.19
      - name: Compile Arduino Uno firmware
        run: pio run -e uno
      - name: Compile Arduino Uno v2 foundation
        run: pio run -e uno_v2
      - name: Run native tests
        run: pio test -e native
      - name: Run native v2 session tests
        run: pio test -e native_v2

  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host development dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]" "build==1.2.2.post1"
      - name: Run host tests
        run: python -m pytest
      - name: Build host distributions
        run: python -m build --wheel --sdist
