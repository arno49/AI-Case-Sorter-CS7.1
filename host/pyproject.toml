[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs71-protocol"
version = "0.1.0"
description = "Dependency-light host library for the CS7.1 serial protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "CS7.1 maintainers"}]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
